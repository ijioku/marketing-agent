<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sample business website</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" />
  <script>
    (function () {
      let theme = 'system';
      try { theme = localStorage.getItem('ma-theme') || 'system'; } catch {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --brand: #0f766e; --canvas: #ffffff; --raised: #ffffff; --mist: #f4f6f9; --ink: #1b1c1f; --slate: #5e6470; --hair: #e6e8ec; --on-ink: #fff;
      --bar: #f4f6f9; --dot: rgba(27, 28, 31, .16);
      --font: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    :root[data-theme="dark"] { color-scheme: dark; --canvas: #0d0e11; --raised: #16181d; --mist: #1d2026; --ink: #eceef2; --slate: #9aa1ad; --hair: #262a31; --on-ink: #0d0e11; --bar: #16181d; --dot: rgba(236, 238, 242, .2); }
    @media (prefers-color-scheme: dark) {
      :root[data-theme="system"] { color-scheme: dark; --canvas: #0d0e11; --raised: #16181d; --mist: #1d2026; --ink: #eceef2; --slate: #9aa1ad; --hair: #262a31; --on-ink: #0d0e11; --bar: #16181d; --dot: rgba(236, 238, 242, .2); }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--canvas); color: var(--ink); font-size: 16px; line-height: 1.55; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    /* Interactive dot field behind the whole page (see /motion.js) */
    #field { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    h1, h2 { font-weight: 650; letter-spacing: -0.035em; margin: 0; }

    /* Demo bar: explains what this page is, and where the owner's side lives */
    .demo-bar { background: var(--bar); border-bottom: 1px solid var(--hair); font-size: 14px; padding: 8px 20px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; text-align: center; }
    .demo-bar a { font-weight: 600; }
    .theme-switch { display: inline-flex; padding: 2px; border: 1px solid var(--hair); border-radius: 999px; background: var(--raised); }
    .theme-switch button { border: 0; background: none; color: var(--slate); font: 500 12px var(--font); padding: 0 10px; min-height: 28px; border-radius: 999px; cursor: pointer; }
    .theme-switch button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

    .nav { max-width: 1080px; margin: 0 auto; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .nav .name { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; font-size: 17px; letter-spacing: -0.01em; }
    .nav .mark { width: 12px; height: 12px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 18%, transparent); }

    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border-radius: 999px; font: 500 16px/1 var(--font); text-decoration: none; cursor: pointer; border: 1px solid var(--brand); background: var(--brand); color: #fff; white-space: nowrap; transition: transform .15s; }
    .btn:hover { transform: translateY(-1px); }
    .btn.ghost { background: transparent; color: var(--ink); border-color: var(--hair); }
    .btn.small { min-height: 40px; padding: 0 18px; font-size: 15px; }

    /* Hero: the business name, big and calm, over a soft glow in its own brand colour */
    .hero { position: relative; isolation: isolate; text-align: center; padding: 72px 20px 88px; overflow: hidden; }
    .hero::before { content: ''; position: absolute; left: var(--gx, 50%); top: var(--gy, 58%); transition: left .9s cubic-bezier(.2, .7, .2, 1), top .9s cubic-bezier(.2, .7, .2, 1); width: min(900px, 140vw); aspect-ratio: 2 / 1; transform: translate(-50%, -50%); background: radial-gradient(closest-side, color-mix(in srgb, var(--brand) 26%, transparent), transparent); filter: blur(10px); z-index: -1; }
    .hero-inner { will-change: transform, opacity; }
    .hero .kind { color: var(--slate); margin: 0 0 14px; }
    .hero h1 { font-size: clamp(42px, 8vw, 96px); line-height: .96; font-weight: 750; letter-spacing: -0.05em; max-width: 14ch; margin: 0 auto 20px; text-wrap: balance; }
    .hero .tagline { color: var(--slate); font-size: clamp(17px, 2.2vw, 20px); max-width: 40ch; margin: 0 auto 34px; text-wrap: pretty; }
    .hero .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

    main { max-width: 1080px; margin: 0 auto; padding: 0 20px 72px; display: grid; gap: 64px; }
    .section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; margin-bottom: 22px; }
    .section-head h2 { font-size: clamp(28px, 4vw, 40px); }
    .section-head p { color: var(--slate); margin: 0; }

    /* Services as a menu/price list: name ..... price */
    .menu { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 48px; }
    .menu li { padding: 18px 0; border-bottom: 1px solid var(--hair); }
    .menu .line { display: flex; align-items: baseline; gap: 10px; }
    .menu .line b { font-weight: 500; }
    .menu .line .leader { flex: 1; border-bottom: 1px dotted var(--hair); transform: translateY(-4px); min-width: 20px; }
    .menu .line .price { white-space: nowrap; }
    .menu .dur { color: var(--slate); font-size: 14px; }

    .visit { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--hair); border: 1px solid var(--hair); border-radius: 28px; overflow: hidden; }
    .visit > div { background: var(--raised); padding: 26px; }
    .visit .label { color: var(--slate); font-size: 14px; margin-bottom: 6px; }
    .visit .value { font-size: 18px; }
    .visit .value a { text-decoration: none; }
    .visit .value a:hover { text-decoration: underline; }
    .visit .wa { display: inline-block; margin-top: 10px; font-size: 15px; font-weight: 500; color: #1f9d55; }

    footer { text-align: center; color: var(--slate); font-size: 14px; padding: 0 20px 44px; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    @media (max-width: 760px) {
      .menu { grid-template-columns: 1fr; }
      .visit { grid-template-columns: 1fr; }
      .hero { padding: 48px 16px 64px; }
      main { padding: 0 16px 56px; gap: 48px; }
      .nav { padding: 14px 16px; }
      .hero .actions .btn { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="demo-bar">
    <span>Sample website. The chat in the corner is the assistant your customers talk to.</span>
    <a href="/admin">See the owner's dashboard</a>
    <div class="theme-switch" id="themeSwitch" role="group" aria-label="Colour theme"></div>
  </div>

  <nav class="nav" aria-label="Site">
    <span class="name"><span class="mark" aria-hidden="true"></span><span id="navName">Loading…</span></span>
    <a class="btn small" id="navBook" href="#" target="_blank" rel="noopener">Book now</a>
  </nav>

  <header class="hero" id="hero">
    <div class="hero-inner" id="heroInner">
    <p class="kind" id="kind"></p>
    <h1 id="name">Loading…</h1>
    <p class="tagline" id="tagline"></p>
    <div class="actions">
      <a class="btn" id="book" href="#" target="_blank" rel="noopener">Book now</a>
      <button type="button" class="btn ghost" id="ask">Ask a question</button>
    </div>
    </div>
  </header>

  <main>
    <section aria-labelledby="svcTitle">
      <div class="section-head"><h2 id="svcTitle">Prices</h2><p>Questions about anything here? Ask the assistant, day or night.</p></div>
      <ul class="menu" id="services"></ul>
    </section>
    <section aria-labelledby="visitTitle">
      <div class="section-head"><h2 id="visitTitle">Visit us</h2></div>
      <div class="visit" id="info"></div>
    </section>
  </main>
  <footer id="foot"></footer>

  <script src="/motion.js"></script>
  <script>
    // ---------- Motion: dots that react to the mouse/finger, a glow that follows it, a hero that lifts on scroll ----------
    // Lighter and darker versions of the brand colour, so the lit-up dots shimmer.
    function shade(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      const ch = (v) => Math.round(amt > 0 ? v + (255 - v) * amt : v * (1 + amt));
      return `rgb(${ch(n >> 16)}, ${ch((n >> 8) & 255)}, ${ch(n & 255)})`;
    }
    let brand = '#0f766e';
    window.MotionField?.start(document.getElementById('field'), { parallax: true, colors: () => [brand, shade(brand, 0.45), shade(brand, -0.25), shade(brand, 0.2)] });

    const heroEl = document.getElementById('hero');
    const heroInner = document.getElementById('heroInner');
    if (!window.MotionField?.reduce) {
      addEventListener('pointermove', (e) => {
        const r = heroEl.getBoundingClientRect();
        if (e.clientY > r.bottom) return;
        heroEl.style.setProperty('--gx', `${((e.clientX - r.left) / r.width) * 100}%`);
        heroEl.style.setProperty('--gy', `${((e.clientY - r.top) / r.height) * 100}%`);
      }, { passive: true });
      let ticking = false;
      addEventListener('scroll', () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          ticking = false;
          const y = Math.min(window.scrollY, heroEl.offsetHeight);
          heroInner.style.transform = `translateY(${y * 0.35}px) scale(${1 - y / heroEl.offsetHeight * 0.06})`;
          heroInner.style.opacity = String(Math.max(0, 1 - y / (heroEl.offsetHeight * 0.85)));
        });
      }, { passive: true });
    }

    // Theme: System / Dark / Light, shared with the dashboard.
    const box = document.getElementById('themeSwitch');
    for (const [key, label] of [['system', 'System'], ['dark', 'Dark'], ['light', 'Light']]) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label; b.dataset.themeSet = key;
      b.addEventListener('click', () => {
        document.documentElement.dataset.theme = key;
        try { localStorage.setItem('ma-theme', key); } catch {}
        paint();
      });
      box.append(b);
    }
    const paint = () => box.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeSet === (document.documentElement.dataset.theme || 'system'))));
    paint();

    const id = location.pathname.split('/').filter(Boolean).pop();
    const el = (tag, text, cls) => { const e = document.createElement(tag); if (text) e.textContent = text; if (cls) e.className = cls; return e; };
    const $ = (s) => document.getElementById(s);

    document.getElementById('ask').addEventListener('click', () => window.dispatchEvent(new Event('marketing-agent:open')));

    // "+234 800 000 5678" → "2348000005678" for a WhatsApp chat link.
    const waDigits = (phone) => { const d = String(phone || '').replace(/\D/g, ''); return String(phone).trim().startsWith('+') && d.length >= 8 ? d : ''; };

    fetch(`/api/public/business/${encodeURIComponent(id)}`)
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((b) => {
        document.title = b.name;
        if (/^#[0-9a-f]{6}$/i.test(b.brandColor || '')) { brand = b.brandColor; document.documentElement.style.setProperty('--brand', b.brandColor); }
        $('navName').textContent = b.name;
        $('name').textContent = b.name;
        $('kind').textContent = b.type || '';
        $('tagline').textContent = b.tagline || '';
        for (const bookId of ['book', 'navBook']) {
          if (/^https?:\/\//i.test(b.bookingLink || '')) $(bookId).href = b.bookingLink; else $(bookId).remove();
        }

        const svc = $('services');
        for (const s of b.services || []) {
          const li = el('li');
          const line = el('div', null, 'line');
          line.append(el('b', s.name), el('span', null, 'leader'), el('span', s.price || '', 'price'));
          li.append(line);
          if (s.duration) li.append(el('div', s.duration, 'dur'));
          svc.append(li);
        }
        if (!svc.children.length) svc.closest('section').remove();

        const info = $('info');
        const add = (label, build) => { const d = el('div'); d.append(el('div', label, 'label')); const v = el('div', null, 'value'); build(v); d.append(v); info.append(d); };
        if (b.hours) add('Hours', (v) => (v.textContent = b.hours));
        if (b.address) add('Address', (v) => (v.textContent = b.address));
        if (b.phone) add('Call or WhatsApp', (v) => {
          const a = el('a', b.phone); a.href = `tel:${b.phone.replace(/[^\d+]/g, '')}`; v.append(a);
          const wa = waDigits(b.phone);
          if (wa) { const w = el('a', 'Chat on WhatsApp', 'wa'); w.href = `https://wa.me/${wa}`; w.target = '_blank'; w.rel = 'noopener'; v.append(el('br'), w); }
        });
        if (!info.children.length) info.closest('section').remove();
        $('foot').textContent = `© ${new Date().getFullYear()} ${b.name} · Chat assistant by Marketing Agent · `;
        const privacy = document.createElement('a');
        privacy.href = '/privacy';
        privacy.textContent = 'Privacy';
        privacy.style.color = 'inherit';
        $('foot').append(privacy);

        const w = document.createElement('script');
        w.src = '/widget.js';
        w.dataset.business = b.id;
        document.body.append(w);
      })
      .catch(() => { $('name').textContent = 'Business not found'; $('navName').textContent = ''; });
  </script>
</body>
</html>
